<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allenamento RCP – Massaggio cardiaco</title>
<style>
  :root {
    --bg: #f2f5f8;
    --panel: #ffffff;
    --text: #14202b;
    --muted: #5d6d7c;
    --line: #d5dde5;
    --accent: #e63946;
    --ok: #1a9a55;
    --good: #d99a00;
    --bad: #d62839;
    --floor: #e3e9ef;
    --skin: #e8b48f;
    --shirt-r: #2b7de9;
    --pants-r: #34495e;
    --shirt-p: #8fa3b5;
    --pants-p: #6b7f91;
    --overlay: rgba(10, 18, 26, .62);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e151c;
      --panel: #17212b;
      --text: #eaf0f5;
      --muted: #9aabba;
      --line: #2a3945;
      --accent: #ff5766;
      --ok: #37d583;
      --good: #ffc933;
      --bad: #ff5766;
      --floor: #1b2732;
      --skin: #d9a47f;
      --shirt-r: #4b97ff;
      --pants-r: #5b7288;
      --shirt-p: #6f8497;
      --pants-p: #53687a;
      --overlay: rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e151c;
    --panel: #17212b;
    --text: #eaf0f5;
    --muted: #9aabba;
    --line: #2a3945;
    --accent: #ff5766;
    --ok: #37d583;
    --good: #ffc933;
    --bad: #ff5766;
    --floor: #1b2732;
    --skin: #d9a47f;
    --shirt-r: #4b97ff;
    --pants-r: #5b7288;
    --shirt-p: #6f8497;
    --pants-p: #53687a;
    --overlay: rgba(0, 0, 0, .7);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%; display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    max-width: 760px; margin: 0 auto; position: relative;
  }

  /* ---------- Header / punteggi ---------- */
  header { padding: 10px 12px 6px; }
  .stats {
    display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 8px;
  }
  .cell {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px 8px; text-align: center; min-width: 0;
  }
  .cell .lbl { font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cell .val { font-weight: 800; font-size: 1.35rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .cell.score .val { font-size: 2.1rem; color: var(--accent); }
  .cell.score.bump .val { animation: bump .25s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
  #mult { color: var(--good); }
  .timebar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .timebar > div { height: 100%; width: 100%; background: var(--accent); transform-origin: left; }

  /* ---------- Scena ---------- */
  #stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #frame {
    position: relative; flex: none; overflow: hidden; border-radius: 16px; background: #2a2f35; isolation: isolate;
    box-shadow: 0 8px 28px rgba(0,0,0,.28);
  }
  #frame img {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0;
    pointer-events: none; -webkit-user-drag: none; user-select: none;
  }
  #frame img.on { opacity: 1; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
  #feedback {
    position: absolute; left: 0; right: 0; top: 4%; text-align: center; pointer-events: none;
    font-weight: 900; letter-spacing: .02em; font-size: clamp(1.7rem, 8vw, 2.8rem);
    opacity: 0; text-shadow: 0 2px 3px rgba(0,0,0,.6), 0 0 16px rgba(0,0,0,.4);
  }
  #feedback small { display: block; font-size: .5em; font-weight: 800; margin-top: 2px; }
  #feedback.pop { animation: popfb .65s ease-out forwards; }
  @keyframes popfb {
    0% { opacity: 0; transform: translateY(14px) scale(.8); }
    15% { opacity: 1; transform: translateY(0) scale(1.08); }
    70% { opacity: 1; transform: translateY(-6px) scale(1); }
    100% { opacity: 0; transform: translateY(-18px) scale(1); }
  }
  #count {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 1.5%; pointer-events: none; text-align: center;
  }
  #count .big { font-size: clamp(2.6rem, 11vw, 4rem); font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 3px 8px rgba(0,0,0,.65); }
  #count .sub { font-weight: 800; color: #fff; margin-top: 6px; text-shadow: 0 2px 6px rgba(0,0,0,.75); }

  .burst { transform-box: fill-box; transform-origin: center; animation: burst .5s ease-out forwards; fill: none; stroke-width: 5; }
  .burst.ok { stroke: var(--ok); }
  .burst.good { stroke: var(--good); }
  .burst.bad { stroke: var(--bad); }
  @keyframes burst { 0% { transform: scale(1); opacity: .95; } 100% { transform: scale(3); opacity: 0; } }
  #targetHalo { fill: none; stroke: rgba(0,0,0,.4); stroke-width: 8; }
  #ringHalo { fill: none; stroke: rgba(0,0,0,.4); stroke-width: 9; }
  #target { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 6 5; }
  #target.ok { stroke: var(--ok); stroke-dasharray: none; stroke-width: 5; }
  #target.good { stroke: var(--good); stroke-dasharray: none; stroke-width: 5; }
  #target.bad { stroke: var(--bad); stroke-dasharray: none; stroke-width: 5; }
  #ring { fill: none; stroke: var(--accent); stroke-width: 4; }

  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 5; }
  #flash.ok { box-shadow: inset 0 0 70px 14px var(--ok); animation: flash .38s ease-out; }
  #flash.good { box-shadow: inset 0 0 60px 10px var(--good); animation: flash .38s ease-out; }
  #flash.bad { box-shadow: inset 0 0 70px 14px var(--bad); animation: flash .38s ease-out; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

  /* ---------- Footer ---------- */
  footer { padding: 4px 12px 14px; text-align: center; }
  #dots { display: flex; justify-content: center; gap: 6px; height: 14px; margin-bottom: 8px; }
  #dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
  #dots span.ok { background: var(--ok); }
  #dots span.good { background: var(--good); }
  #dots span.bad { background: var(--bad); }
  #hint { font-weight: 700; color: var(--muted); font-size: .95rem; }
  #hint b { color: var(--text); }
  #mute {
    position: absolute; right: 14px; bottom: 70px; border: 1px solid var(--line); background: var(--panel); opacity: .9;
    color: var(--text); border-radius: 50%; width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer; z-index: 2;
  }

  /* ---------- Overlay ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: var(--overlay); padding: 16px; overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  .card {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 18px;
    padding: 22px 20px; max-width: 440px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  .card h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .card h2 { margin: 0 0 4px; font-size: 1.3rem; }
  .card p { color: var(--muted); margin: 6px 0; line-height: 1.4; font-size: .95rem; }
  .card ol { text-align: left; margin: 12px 0; padding-left: 22px; line-height: 1.45; font-size: .95rem; }
  .card ol li { margin-bottom: 6px; }
  .btn {
    margin-top: 14px; width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 1.15rem; font-weight: 800;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .legend { display: flex; justify-content: center; gap: 12px; font-size: .8rem; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .bigscore { font-size: 3.4rem; font-weight: 900; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .record { font-weight: 800; color: var(--good); }
  .stars { font-size: 1.9rem; letter-spacing: 4px; color: var(--good); margin: 4px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
  .grid2 div { background: var(--bg); border-radius: 12px; padding: 8px; }
  .grid2 b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
  .grid2 span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .disc { font-size: .75rem !important; margin-top: 12px !important; }

  @media (max-height: 560px) {
    .cell .val { font-size: 1.1rem; } .cell.score .val { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stats">
      <div class="cell score" id="scoreCell"><div class="lbl">Punti</div><div class="val" id="score">0</div></div>
      <div class="cell"><div class="lbl">Record</div><div class="val" id="best">0</div></div>
      <div class="cell"><div class="lbl">Tempo</div><div class="val" id="time">30</div></div>
      <div class="cell"><div class="lbl">Combo</div><div class="val"><span id="combo">0</span> <small id="mult"></small></div></div>
    </div>
    <div class="timebar"><div id="bar"></div></div>
  </header>

  <main id="stage">
    <div id="frame" role="img" aria-label="Soccorritore che esegue il massaggio cardiaco su un paziente">
      <svg id="scene" viewBox="0 0 323 512" preserveAspectRatio="none" aria-hidden="true">
        <circle id="targetHalo" cx="200" cy="376" r="34"/>
        <circle id="target" cx="200" cy="376" r="34"/>
        <circle id="ringHalo" cx="200" cy="376" r="110" opacity="0"/>
        <circle id="ring" cx="200" cy="376" r="110" opacity="0"/>
        <g id="fx"></g>
      </svg>
    </div>
    <div id="feedback"></div>
    <div id="count"><div class="big" id="countNum">3</div><div class="sub">Ascolta il ritmo…</div></div>
  </main>

  <footer>
    <div id="dots"></div>
    <div id="hint">Tocca <b>ovunque</b> sul battito &nbsp;·&nbsp; PC: <b>SPAZIO</b></div>
  </footer>
  <button id="mute" aria-label="Audio on/off" title="Audio">🔊</button>
</div>

<div id="flash"></div>

<div id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(function () {
  "use strict";

  /* ============ Parametri di gioco ============ */
  const BPM = 110;                       // linee guida ERC/AHA: 100-120 compressioni/min
  const INTERVAL = 60000 / BPM;          // ms tra due compressioni
  const DURATION = 30000;                // 30 secondi
  const N_BEATS = Math.floor(DURATION / INTERVAL);
  const COUNTDOWN = 3000;
  const PERFECT_MS = 70;                 // tolleranza "Perfetto"
  const GOOD_MS = 140;                   // tolleranza "Bene"
  const PTS_PERFECT = 10, PTS_GOOD = 5;
  const STORE_KEY = "rcp_sim_best_v1";

  /* ============ Stato ============ */
  let state = "idle";                    // idle | countdown | playing | over
  let t0 = 0;
  let score = 0, combo = 0, maxCombo = 0;
  let perfect = 0, good = 0, miss = 0, extra = 0;
  let results = [];
  let taps = [];
  let pressT = -1e9;
  let nextAudioK = 0, nextMissK = 0;
  let storedBest = 0;
  let muted = false;
  let history = [];
  let lastCountShown = null;

  try { storedBest = parseInt(localStorage.getItem(STORE_KEY) || "0", 10) || 0; } catch (e) { storedBest = 0; }

  /* ============ DOM ============ */
  const $ = (id) => document.getElementById(id);
  const elScore = $("score"), elBest = $("best"), elTime = $("time"), elCombo = $("combo"), elMult = $("mult");
  const elBar = $("bar"), elScoreCell = $("scoreCell"), elFeedback = $("feedback"), elFlash = $("flash");
  const elCount = $("count"), elCountNum = $("countNum"), elDots = $("dots"), elFx = $("fx");
  const elOverlay = $("overlay"), elCard = $("card"), elMute = $("mute");
  const sTarget = $("target"), sRing = $("ring"), sRingHalo = $("ringHalo");
  const elStage = $("stage"), elFrame = $("frame"), elScene = $("scene");
  const SVGNS = "http://www.w3.org/2000/svg";

  /* ============ Audio (metronomo) ============ */
  let actx = null;
  function ensureAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) { actx = null; }
  }
  function clickAt(sec, freq) {
    if (!actx || muted) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = freq || 900;
      g.gain.setValueAtTime(0.0001, sec);
      g.gain.exponentialRampToValueAtTime(0.5, sec + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, sec + 0.07);
      o.connect(g); g.connect(actx.destination);
      o.start(sec); o.stop(sec + 0.09);
    } catch (e) {}
  }
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  elMute.addEventListener("click", function (e) {
    e.stopPropagation();
    muted = !muted;
    elMute.textContent = muted ? "🔇" : "🔊";
  });

  /* ============ UI helpers ============ */
  function multiplier() { return 1 + Math.min(3, Math.floor(combo / 10)); }

  function updateHud(now) {
    elScore.textContent = score;
    elBest.textContent = Math.max(storedBest, score);
    elCombo.textContent = combo;
    const m = multiplier();
    elMult.textContent = m > 1 ? "×" + m : "";
    if (state === "playing" || state === "over") {
      const left = Math.max(0, t0 + DURATION - now);
      elTime.textContent = Math.ceil(left / 1000);
      elBar.style.transform = "scaleX(" + (left / DURATION).toFixed(4) + ")";
    } else {
      elTime.textContent = Math.round(DURATION / 1000);
      elBar.style.transform = "scaleX(1)";
    }
  }

  function renderDots() {
    elDots.innerHTML = "";
    history.forEach(function (c) {
      const s = document.createElement("span"); s.className = c; elDots.appendChild(s);
    });
  }
  function pushDot(cls) {
    history.push(cls);
    if (history.length > 12) history.shift();
    renderDots();
  }

  function showFeedback(text, cls, sub) {
    elFeedback.className = "";
    elFeedback.innerHTML = text + (sub ? "<small>" + sub + "</small>" : "");
    elFeedback.style.color = "var(--" + cls + ")";
    void elFeedback.offsetWidth;
    elFeedback.className = "pop";
  }
  function flash(cls) {
    elFlash.className = "";
    void elFlash.offsetWidth;
    elFlash.className = cls;
  }
  function burst(cls) {
    const c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("cx", 200); c.setAttribute("cy", 376); c.setAttribute("r", 34);
    c.setAttribute("class", "burst " + cls);
    c.addEventListener("animationend", function () { c.remove(); });
    elFx.appendChild(c);
    sTarget.setAttribute("class", cls);
    setTimeout(function () { sTarget.removeAttribute("class"); }, 160);
  }
  function bumpScore() {
    elScoreCell.classList.remove("bump");
    void elScoreCell.offsetWidth;
    elScoreCell.classList.add("bump");
  }

  /* ============ Animazione con le foto ============ */
  // 6 fotogrammi: 1 -> 4 discesa (il 4 è la massima compressione), 4 -> 6 risalita.
  // Tra un fotogramma e l'altro viene fatta una dissolvenza incrociata, così il movimento è fluido.

  ];
  const REST = 5;                        // a riposo = fotogramma 6 (braccia estese)
  // [ms dal tocco, indice fotogramma]: il 4 (indice 3) è la massima compressione
  const KEYS = [[0, 5], [22, 0], [50, 1], [78, 2], [106, 3], [140, 3], [185, 4], [250, 5]];
  const FW = 323, FH = 512;
  const frameImgs = FRAME_SRC.map(function (src) {
    const img = new Image();
    img.src = src; img.alt = ""; img.draggable = false;
    elFrame.insertBefore(img, elScene);
    if (img.decode) img.decode().catch(function () {});
    return img;
  });
  let shownA = -1, shownB = -1, shownO = -1;
  function render(a, b, f) {
    // a = fotogramma sotto (opacità piena), b = fotogramma sopra con opacità f
    if (a === shownA && b === shownB && Math.abs(f - shownO) < 0.01) return;
    for (let i = 0; i < frameImgs.length; i++) {
      const st = frameImgs[i].style;
      if (i === a) { st.opacity = "1"; st.zIndex = "1"; }
      else if (i === b) { st.opacity = f.toFixed(3); st.zIndex = "2"; }
      else { st.opacity = "0"; st.zIndex = "0"; }
    }
    shownA = a; shownB = b; shownO = f;
  }
  function poseAt(now, active) {
    const t = now - pressT;
    if (!active || t < 0 || t >= KEYS[KEYS.length - 1][0]) return render(REST, REST, 0);
    for (let j = 1; j < KEYS.length; j++) {
      if (t < KEYS[j][0]) {
        const k0 = KEYS[j - 1], k1 = KEYS[j];
        let u = (t - k0[0]) / (k1[0] - k0[0]);
        u = u * u * (3 - 2 * u);         // easing morbido
        return k0[1] === k1[1] ? render(k0[1], k0[1], 0) : render(k0[1], k1[1], u);
      }
    }
    render(REST, REST, 0);
  }
  function layout() {
    const w = elStage.clientWidth, h = elStage.clientHeight;
    if (!w || !h) return;
    const s = Math.min(w / FW, h / FH);
    elFrame.style.width = Math.floor(FW * s) + "px";
    elFrame.style.height = Math.floor(FH * s) + "px";
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(elStage);
  layout();

  /* ============ Giudizio dei colpi ============ */
  function register(k, kind) {
    results[k] = kind;
    if (kind === "perfect") {
      perfect++; combo++;
      maxCombo = Math.max(maxCombo, combo);
      score += PTS_PERFECT * multiplier();
    } else if (kind === "good") {
      good++; combo++;
      maxCombo = Math.max(maxCombo, combo);
      score += PTS_GOOD * multiplier();
    } else {
      miss++; combo = 0;
    }
  }

  function onTap(ts) {
    if (state !== "playing") return;
    const now = performance.now();
    let t = (typeof ts === "number" && ts > 0 && ts < 1e11) ? ts : now;
    if (t > now + 5) t = now;
    if (t < t0 - INTERVAL / 2) return;

    pressT = now;
    taps.push(t);

    const k = Math.round((t - t0) / INTERVAL);
    if (k < 0 || k >= N_BEATS) return;
    const delta = t - (t0 + k * INTERVAL);
    const abs = Math.abs(delta);
    const wrongWay = delta < 0 ? "TROPPO PRESTO" : "TROPPO TARDI";

    if (results[k] === "miss" && abs > GOOD_MS) {
      showFeedback(wrongWay, "bad");
      burst("bad"); flash("bad"); pushDot("bad");
      combo = 0; updateHud(now);
      return;
    }
    if (results[k]) {
      extra++; combo = 0;
      showFeedback("COLPO IN PIÙ", "bad", "uno per battito");
      burst("bad"); flash("bad"); pushDot("bad"); vibrate(40);
      updateHud(now);
      return;
    }

    const before = score;
    if (abs <= PERFECT_MS) {
      register(k, "perfect");
      showFeedback("PERFETTO!", "ok", "+" + (score - before));
      burst("ok"); flash("ok"); pushDot("ok"); vibrate(18); bumpScore();
    } else if (abs <= GOOD_MS) {
      register(k, "good");
      showFeedback("BENE", "good", "+" + (score - before) + (delta < 0 ? " · un po' presto" : " · un po' tardi"));
      burst("good"); flash("good"); pushDot("good"); vibrate(12); bumpScore();
    } else {
      register(k, "miss");
      showFeedback(wrongWay, "bad");
      burst("bad"); flash("bad"); pushDot("bad"); vibrate(40);
    }
    updateHud(now);
  }

  /* ============ Input ============ */
  $("app").addEventListener("pointerdown", function (e) {
    if (state !== "playing") return;
    if (e.target === elMute) return;
    e.preventDefault();
    onTap(e.timeStamp);
  });
  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    if (e.code === "Space" || e.key === " ") {
      if (state === "playing") { e.preventDefault(); onTap(e.timeStamp); }
      else if (state === "idle" || state === "over") { e.preventDefault(); startGame(); }
    } else if (e.key === "Enter" && (state === "idle" || state === "over")) {
      e.preventDefault(); startGame();
    }
  });

  /* ============ Flusso partita ============ */
  function startGame() {
    if (state === "countdown" || state === "playing") return;
    ensureAudio();
    score = 0; combo = 0; maxCombo = 0; perfect = 0; good = 0; miss = 0; extra = 0;
    results = new Array(N_BEATS); taps = []; history = []; renderDots();
    storedBest = readBest();
    pressT = -1e9;
    t0 = performance.now() + COUNTDOWN;
    nextAudioK = -4;                     // 4 battiti di anteprima
    nextMissK = 0;
    lastCountShown = null;
    state = "countdown";
    elOverlay.classList.add("hidden");
    elCount.style.display = "flex";
    elFeedback.className = "";
    updateHud(performance.now());
  }

  function readBest() {
    try { return parseInt(localStorage.getItem(STORE_KEY) || "0", 10) || 0; } catch (e) { return storedBest; }
  }

  function endGame(now) {
    for (let k = 0; k < N_BEATS; k++) if (!results[k]) { results[k] = "miss"; miss++; }
    state = "over";
    combo = 0;
    updateHud(now);
    elCount.style.display = "none";
    render(REST, REST, 0);

    const prevBest = readBest();
    const isRecord = score > prevBest && score > 0;
    if (isRecord) {
      storedBest = score;
      try { localStorage.setItem(STORE_KEY, String(score)); } catch (e) {}
    }
    updateHud(now);

    const correct = perfect + good;
    const acc = Math.round((correct / N_BEATS) * 100);
    let rate = null;
    if (taps.length >= 4) {
      rate = Math.round(((taps.length - 1) / (taps[taps.length - 1] - taps[0])) * 60000);
    }
    const stars = acc >= 90 ? 3 : acc >= 70 ? 2 : acc >= 40 ? 1 : 0;
    const msg = acc >= 90 ? "Ritmo eccellente: compressioni costanti e regolari."
              : acc >= 70 ? "Buon lavoro: ancora un po' di costanza sul ritmo."
              : acc >= 40 ? "Si può migliorare: segui il battito e mantieni il passo."
              : "Riprova: ascolta il metronomo e premi a tempo.";
    let rateTxt = "–";
    if (rate !== null) rateTxt = rate + "/min";
    const rateNote = rate === null ? "" :
      (rate >= 100 && rate <= 120 ? "Frequenza nell'intervallo raccomandato (100–120/min)."
        : rate < 100 ? "Frequenza troppo lenta (obiettivo 100–120/min)."
        : "Frequenza troppo veloce (obiettivo 100–120/min).");

    elCard.innerHTML =
      '<h2>Fine esercizio</h2>' +
      '<div class="bigscore">' + score + '</div>' +
      '<div class="lbl" style="color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em">punti</div>' +
      (isRecord ? '<div class="record">🏆 Nuovo record!</div>' : '<div class="record" style="color:var(--muted)">Record: ' + Math.max(prevBest, score) + '</div>') +
      '<div class="stars">' + "★".repeat(stars) + '<span style="opacity:.25">' + "★".repeat(3 - stars) + '</span></div>' +
      '<p style="color:var(--text);font-weight:700;margin-top:0">' + msg + '</p>' +
      '<div class="grid2">' +
        '<div><b>' + correct + ' / ' + N_BEATS + '</b><span>Compressioni corrette</span></div>' +
        '<div><b>' + acc + '%</b><span>Precisione</span></div>' +
        '<div><b>' + perfect + ' · ' + good + '</b><span>Perfette · Buone</span></div>' +
        '<div><b>' + miss + (extra ? ' (+' + extra + ' extra)' : '') + '</b><span>Mancate</span></div>' +
        '<div><b>' + maxCombo + '</b><span>Combo massima</span></div>' +
        '<div><b>' + rateTxt + '</b><span>Frequenza media</span></div>' +
      '</div>' +
      (rateNote ? '<p>' + rateNote + '</p>' : '') +
      '<button class="btn" id="again">Ricomincia</button>';
    elOverlay.classList.remove("hidden");
    $("again").addEventListener("click", startGame);
  }

  function showStart() {
    elCard.innerHTML =
      '<h1>❤️ Allenamento RCP</h1>' +
      '<p>Simulatore di massaggio cardiaco</p>' +
      '<ol>' +
        '<li>Ascolta il metronomo: <b>' + BPM + ' compressioni al minuto</b> (intervallo raccomandato 100–120).</li>' +
        '<li><b>Tocca lo schermo</b> (o premi <b>SPAZIO</b>) esattamente sul battito, quando l\'anello si chiude sul bersaglio.</li>' +
        '<li>Ogni compressione corretta fa punti; le serie senza errori aumentano il moltiplicatore. L\'esercizio dura <b>30 secondi</b>.</li>' +
      '</ol>' +
      '<div class="legend"><span><i style="background:var(--ok)"></i>Perfetto +10</span><span><i style="background:var(--good)"></i>Bene +5</span><span><i style="background:var(--bad)"></i>Fuori tempo</span></div>' +
      '<button class="btn" id="go">Inizia</button>' +
      '<p class="disc">Prototipo didattico per l\'allenamento del ritmo: non sostituisce un corso BLS-D certificato.</p>';
    elOverlay.classList.remove("hidden");
    $("go").addEventListener("click", startGame);
  }

  /* ============ Loop principale ============ */
  function frame() {
    const now = performance.now();

    // anello ritmo
    if (state === "countdown" || state === "playing") {
      const t = now - t0;
      const phase = (((t % INTERVAL) + INTERVAL) % INTERVAL) / INTERVAL;
      const rr = (34 + (1 - phase) * 84).toFixed(1), oo = (0.2 + 0.8 * phase).toFixed(2);
      sRing.setAttribute("r", rr); sRing.setAttribute("opacity", oo);
      sRingHalo.setAttribute("r", rr); sRingHalo.setAttribute("opacity", oo);

      // metronomo (pianificato in anticipo)
      while (nextAudioK < N_BEATS && (t0 + nextAudioK * INTERVAL) - now < 160) {
        const at = actx ? actx.currentTime + Math.max(0, (t0 + nextAudioK * INTERVAL - now) / 1000) : 0;
        clickAt(at, nextAudioK >= 0 ? 900 : 700);
        nextAudioK++;
      }
    } else {
      sRing.setAttribute("opacity", "0"); sRingHalo.setAttribute("opacity", "0");
    }

    if (state === "countdown") {
      const left = t0 - now;
      const n = Math.max(1, Math.ceil(left / 1000));
      if (n !== lastCountShown) { elCountNum.textContent = n; lastCountShown = n; }
      if (left <= 0) {
        state = "playing";
        elCount.style.display = "none";
      }
    }

    if (state === "playing") {
      // battiti non premuti
      while (nextMissK < N_BEATS && now > t0 + nextMissK * INTERVAL + GOOD_MS) {
        if (!results[nextMissK]) {
          register(nextMissK, "miss");
          showFeedback("MANCATO", "bad");
          pushDot("bad"); flash("bad");
        }
        nextMissK++;
      }
      if (now >= t0 + DURATION) { endGame(now); }
    }

    if (state !== "idle") updateHud(now);
    poseAt(now, state === "playing" || state === "countdown");
    requestAnimationFrame(frame);
  }

  /* ============ Avvio ============ */
  render(REST, REST, 0);
  updateHud(performance.now());
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
